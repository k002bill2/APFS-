<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>발급 온보딩 — 에이핏(AFIT)</title>
<style>
/* ═══ APFS 디자인 토큰 (디자인_작업_가이드 §1) ═══ */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#F7F9FC; --surface-3:#EEF2F7;
  --border:#DCE0E6; --border-strong:#C3CAD3;
  --ink:#1A1D21; --ink-2:#48505A; --ink-3:#6B7480;
  --primary:#256EF4; --primary-hover:#1E5AD6; --primary-weak:#EAF1FE;
  --ok:#0E7C86; --ok-weak:#E2F3F4;
  --amber:#B45309; --amber-weak:#FBF0E1;
  --danger:#E5484D; --danger-weak:#FDECEC;
  --navy:#16233F;
  --radius:8px; --radius-sm:6px; --radius-lg:12px;
  --shadow:0 1px 3px rgba(16,24,40,.08);
  --shadow-lg:0 12px 40px rgba(16,24,40,.22);
  --ring:0 0 0 3px rgba(37,110,244,.35);
  --font:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){
    --bg:#0F141B; --surface:#171E27; --surface-2:#1C242F; --surface-3:#232C38;
    --border:#2C3846; --border-strong:#3A4757;
    --ink:#EAEEF3; --ink-2:#AEB8C4; --ink-3:#7E8996;
    --primary:#5B94FF; --primary-hover:#7AA8FF; --primary-weak:#16233B;
    --ok:#3FB8C2; --ok-weak:#123033;
    --amber:#E7A24A; --amber-weak:#2A2113;
    --danger:#F26D6D; --danger-weak:#2A1616;
    --navy:#0D1526;
    --shadow:0 1px 3px rgba(0,0,0,.4); --shadow-lg:0 12px 40px rgba(0,0,0,.55);
  }
}
:root[data-theme=dark]{
  --bg:#0F141B; --surface:#171E27; --surface-2:#1C242F; --surface-3:#232C38;
  --border:#2C3846; --border-strong:#3A4757;
  --ink:#EAEEF3; --ink-2:#AEB8C4; --ink-3:#7E8996;
  --primary:#5B94FF; --primary-hover:#7AA8FF; --primary-weak:#16233B;
  --ok:#3FB8C2; --ok-weak:#123033;
  --amber:#E7A24A; --amber-weak:#2A2113;
  --danger:#F26D6D; --danger-weak:#2A1616;
  --navy:#0D1526;
  --shadow:0 1px 3px rgba(0,0,0,.4); --shadow-lg:0 12px 40px rgba(0,0,0,.55);
}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5}
table{font-variant-numeric:tabular-nums}
code{background:var(--surface-3);padding:1px 6px;border-radius:4px;font-size:12.5px}
a{color:var(--primary)}

/* ═══ 레이아웃 골격 (§2) ═══ */
.wrap{max-width:1300px;margin:0 auto;padding:14px 16px 40px}
.opts{display:flex;gap:10px;align-items:center;justify-content:flex-end;margin:0 0 10px;font-size:12.5px;color:var(--ink-3)}
.opts .seg{display:inline-flex;border:1px solid var(--border);border-radius:20px;overflow:hidden;background:var(--surface)}
.opts .seg button{border:0;background:transparent;color:var(--ink-3);font:inherit;font-size:12px;font-weight:600;padding:5px 12px;cursor:pointer}
.opts .seg button.on{background:var(--primary);color:#fff}
.frame{border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow);background:var(--surface)}

/* topbar */
.topbar{display:flex;align-items:center;gap:18px;background:var(--navy);color:#fff;padding:0 18px;height:52px;position:relative}
.sysmark{display:flex;align-items:center;gap:9px;cursor:pointer;border-radius:8px;padding:6px 8px;margin-left:-8px}
.sysmark:hover{background:rgba(255,255,255,.08)}
.sysmark .mk{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,#4C86F5 50%,#9DBEF9 50%);flex:none}
.sysmark b{font-size:15px;letter-spacing:-.01em;white-space:nowrap}
.sysmark small{color:#9FB0CC;font-weight:500;white-space:nowrap}
.brandtxt{display:flex;flex-direction:column;line-height:1.18}
.brandtxt small{font-size:11px}
.gnb-menu{display:flex;gap:2px;height:100%}
.app[data-nav=lnb] .gnb-menu{display:none}
.gnb-menu a{display:flex;align-items:center;padding:0 15px;color:#C9D4E6;text-decoration:none;font-weight:600;font-size:14px;border-bottom:3px solid transparent;border-top:3px solid transparent}
.gnb-menu a:hover{color:#fff}
.gnb-menu a.on{color:#fff;border-bottom-color:var(--primary)}
.who{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12.5px;color:#C9D4E6;white-space:nowrap}
.who b{color:#fff}
.who .wtag{background:rgba(255,255,255,.12);border-radius:12px;padding:2px 9px;font-size:11.5px}
.who button{border:1px solid rgba(255,255,255,.25);background:transparent;color:#C9D4E6;border-radius:6px;font:inherit;font-size:11.5px;padding:3px 9px;cursor:pointer}
.who button:hover{color:#fff;border-color:rgba(255,255,255,.5)}

/* 시스템 전환 메뉴 */
.sysmenu{position:absolute;top:50px;left:10px;z-index:60;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-lg);min-width:230px;padding:6px;display:none}
.sysmenu.open{display:block}
.sysmenu a{display:flex;gap:10px;align-items:center;padding:9px 11px;border-radius:6px;color:var(--ink);text-decoration:none;font-size:13.5px;font-weight:600}
.sysmenu a:hover{background:var(--surface-2)}
.sysmenu a.cur{background:var(--primary-weak);color:var(--primary)}
.sysmenu .dot{width:8px;height:8px;border-radius:50%;background:var(--border-strong);flex:none}
.sysmenu a.cur .dot{background:var(--primary)}
.sysmenu .divider{height:1px;background:var(--border);margin:5px 4px}

/* subtab */
.subtab{display:flex;gap:2px;background:var(--surface);border-bottom:1px solid var(--border);padding:0 14px}
.app[data-nav=lnb] .subtab{display:none}
.subtab a{padding:11px 14px;color:var(--ink-3);text-decoration:none;font-size:13.5px;font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px}
.subtab a:hover{color:var(--ink)}
.subtab a.on{color:var(--primary);border-bottom-color:var(--primary)}

/* mid / lnb / content */
.mid{display:flex;min-height:640px;background:var(--bg)}
.lnb{width:216px;flex:none;background:var(--surface);border-right:1px solid var(--border);padding:14px 10px;display:none}
.app[data-nav=lnb] .lnb{display:block}
.lnb .lnb-title{font-size:12px;font-weight:700;color:var(--ink-3);margin:2px 8px 8px;letter-spacing:.03em}
.lnb a{display:block;padding:9px 12px;border-radius:8px;color:var(--ink-2);text-decoration:none;font-size:13.5px;font-weight:600;margin-bottom:2px}
.lnb a:hover{background:var(--surface-2)}
.lnb a.on{background:var(--primary-weak);color:var(--primary)}
.content{flex:1;min-width:0;padding:18px 20px 30px}
.pagehead{display:flex;align-items:baseline;gap:10px;margin:2px 0 14px}
.pagehead h1{font-size:19px;margin:0;letter-spacing:-.01em}
.pagehead .desc{font-size:12.5px;color:var(--ink-3)}

/* ═══ 버튼 (§3) ═══ */
.btn,.btn-sec,.btn-danger{height:36px;padding:0 14px;border-radius:var(--radius-sm);font:inherit;font-size:13.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn{border:1px solid var(--primary);background:var(--primary);color:#fff}
.btn:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.btn-sec{border:1px solid var(--border-strong);background:var(--surface);color:var(--ink)}
.btn-sec:hover{background:var(--surface-2)}
.btn-danger{border:1px solid var(--border-strong);background:var(--surface);color:var(--danger)}
.btn-danger:hover{background:var(--danger-weak);border-color:var(--danger)}
.btn-sm{height:36px;padding:0 12px;font-size:12.5px}
.btn-xs{height:36px;padding:0 9px;font-size:11.5px;font-weight:600}
.btn[disabled],.btn-sec[disabled],.btn-danger[disabled]{opacity:.45;pointer-events:none}

/* ═══ 검색박스 / 필터 ═══ */
.searchbox{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px 12px;margin-bottom:14px;box-shadow:var(--shadow)}
.filtergrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 22px}
.field{display:flex;align-items:center;gap:10px;min-width:0}
.field>label{flex:none;min-width:56px;width:76px;text-align:right;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.field>.ctrl{flex:1;min-width:0;display:flex;gap:6px;align-items:center}
.search-foot{display:flex;justify-content:center;gap:8px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--border)}
.search-foot .btn,.search-foot .btn-sec{min-width:96px}

/* ═══ 리스트바 / 그리드 ═══ */
.listbar{display:flex;align-items:center;gap:10px;margin:0 0 8px}
.listbar .total{font-size:13px;color:var(--ink-2)}
.listbar .total b{color:var(--primary)}
.listbar .acts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.gridwrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:auto;box-shadow:var(--shadow);max-height:560px}
table.grid{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
table.grid thead th{position:sticky;top:0;z-index:5;background:var(--surface-2);color:var(--ink-2);font-size:12px;font-weight:700;text-align:left;padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
table.grid th.c,table.grid td.c{text-align:center}
table.grid th.r,table.grid td.r{text-align:right}
table.grid th.no{width:44px;text-align:center}
table.grid td{padding:8px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
table.grid tbody tr{cursor:pointer}
table.grid tbody tr:hover{background:var(--surface-2)}
table.grid tbody tr.sel{background:var(--primary-weak);box-shadow:inset 3px 0 0 var(--primary)}
table.grid tbody tr.nosel{cursor:default}
table.grid tbody tr.nosel:hover{background:transparent}
th.sortable{cursor:pointer;user-select:none}
th.sortable::after{content:'↕';margin-left:5px;color:var(--border-strong);font-size:10px}
th.sortable[aria-sort=ascending]::after{content:'↑';color:var(--primary)}
th.sortable[aria-sort=descending]::after{content:'↓';color:var(--primary)}
.empty-row td{color:var(--ink-3);text-align:center;padding:26px 0;cursor:default}
/* 모달 내부 보조 그리드 */
.mgridwrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-sm)}
table.mgrid{width:100%;border-collapse:collapse;font-size:12.5px}
table.mgrid th{background:var(--surface-2);color:var(--ink-2);font-size:11.5px;font-weight:700;text-align:left;padding:7px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
table.mgrid td{padding:6px 10px;border-bottom:1px solid var(--border)}
table.mgrid tr:last-child td{border-bottom:0}
table.mgrid th.c,table.mgrid td.c{text-align:center}

/* ═══ 폼 필드 ═══ */
input,select,textarea{height:36px;padding:0 10px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);background:var(--surface);color:var(--ink);font:inherit;font-size:13.5px;min-width:0}
textarea{height:auto;padding:8px 10px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:none;box-shadow:var(--ring);border-color:var(--primary)}
input[readonly]{background:var(--surface-3);color:var(--ink-2)}
input::placeholder{color:var(--ink-3)}
.frow{display:grid;grid-template-columns:120px 1fr;gap:8px 12px;align-items:center;margin-bottom:10px}
.frow>label{font-size:12.5px;font-weight:600;color:var(--ink-2);text-align:right}
.frow .req::after{content:' *';color:var(--danger)}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 26px}
.radio-inline{display:flex;gap:14px;align-items:center;height:36px}
.radio-inline label{display:flex;gap:5px;align-items:center;font-size:13.5px;cursor:pointer}
.hint{font-size:12px;color:var(--ink-3);margin-top:3px}
.note{font-size:12.5px;color:var(--ink-2);background:var(--surface-2);border:1px dashed var(--border);border-radius:var(--radius-sm);padding:10px 12px;margin:10px 0}
.chkgrp{display:flex;gap:6px;flex-wrap:wrap}
.chk{display:inline-flex;gap:6px;align-items:center;padding:6px 11px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;background:var(--surface)}
.chk input{height:14px;margin:0}
.chk.on{background:var(--primary-weak);border-color:var(--primary);color:var(--primary)}

/* ═══ 모달 ═══ */
.scrim{position:fixed;inset:0;background:rgba(10,16,28,.5);z-index:100;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:40px 16px}
.scrim.open{display:flex}
.modal{background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);width:760px;max-width:100%;display:flex;flex-direction:column;max-height:calc(100vh - 80px)}
.modal.wmodal{width:1280px}
.modal.smodal{width:420px}
.modal-head{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:10px;padding:15px 20px;border-bottom:1px solid var(--border);background:var(--surface);border-radius:var(--radius-lg) var(--radius-lg) 0 0}
.modal-head h2{font-size:16px;margin:0;flex:1}
.modal-head .x{border:0;background:transparent;color:var(--ink-3);font-size:20px;cursor:pointer;line-height:1;padding:2px 6px;border-radius:6px}
.modal-head .x:hover{background:var(--surface-2);color:var(--ink)}
.modal-body{padding:18px 20px;overflow-y:auto}
.modal-foot{position:sticky;bottom:0;display:flex;justify-content:flex-end;gap:8px;padding:13px 20px;border-top:1px solid var(--border);background:var(--surface);border-radius:0 0 var(--radius-lg) var(--radius-lg)}
.modal-foot .left{margin-right:auto;display:flex;gap:8px}
/* 모달 위 소형 서브다이얼로그 (.addrpick 패턴) */
.addrpick{position:fixed;z-index:130;background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--radius);box-shadow:var(--shadow-lg);width:360px;max-width:92vw;padding:16px;display:none}
.addrpick.open{display:block}
.addrpick h3{margin:0 0 10px;font-size:14px}

/* ═══ 배지 / 상태 ═══ */
.dbadge{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:12px;font-size:11.5px;font-weight:700;white-space:nowrap}
.dbadge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.dbadge.ok{background:var(--ok-weak);color:var(--ok)}
.dbadge.amber{background:var(--amber-weak);color:var(--amber)}
.dbadge.grey{background:var(--surface-3);color:var(--ink-3)}
.dbadge.danger{background:var(--danger-weak);color:var(--danger)}
.dbadge.blue{background:var(--primary-weak);color:var(--primary)}
.kind-badge{display:inline-block;padding:1px 8px;border-radius:5px;font-size:11px;font-weight:700}
.kind-badge.base{background:var(--ok-weak);color:var(--ok)}
.kind-badge.chg{background:var(--primary-weak);color:var(--primary)}
.hist-locked{font-size:11px;color:var(--ink-3);border:1px solid var(--border);border-radius:5px;padding:1px 7px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:8px;font-weight:600;font-size:13.5px;z-index:200;box-shadow:var(--shadow-lg)}

/* ═══ ⚠ 검토 마커 ═══ */
.mk-warn{display:inline-flex;align-items:center;gap:4px;background:var(--amber-weak);color:var(--amber);border:1px dashed var(--amber);border-radius:5px;padding:0 7px;font-size:11.5px;font-weight:700;cursor:pointer;height:20px;vertical-align:middle}
.mk-pop{position:fixed;z-index:150;width:330px;max-width:90vw;background:var(--surface);border:1px solid var(--amber);border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:13px 15px;font-size:12.5px;display:none}
.mk-pop.open{display:block}
.mk-pop h4{margin:0 0 7px;font-size:12.5px;color:var(--amber)}
.mk-pop .row{display:grid;grid-template-columns:52px 1fr;gap:4px 8px;margin-bottom:4px}
.mk-pop .row b{color:var(--ink-3);font-weight:600;font-size:11.5px}

/* ═══ 인증(로그인·온보딩) 독립 페이지 ═══ */
.authwrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:34px 16px;background:
  radial-gradient(900px 420px at 70% -10%, var(--primary-weak), transparent 60%), var(--bg)}
.authcard{width:440px;max-width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);overflow:hidden}
.authcard.wide{width:620px}
.authhead{background:var(--navy);color:#fff;padding:20px 24px;display:flex;gap:11px;align-items:center}
.authhead .mk{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#4C86F5 50%,#9DBEF9 50%);flex:none}
.authhead b{font-size:17px;display:block}
.authhead small{color:#9FB0CC;font-size:12px}
.authbody{padding:22px 24px 24px}
.authfoot{padding:0 24px 20px;font-size:12px;color:var(--ink-3);display:flex;gap:12px;justify-content:center}
.authfoot a{color:var(--ink-3)}
.steps{display:flex;gap:6px;margin:0 0 16px;flex-wrap:wrap}
.steps .s{padding:4px 11px;border-radius:20px;background:var(--surface-3);color:var(--ink-3);font-size:12px;font-weight:700}
.steps .s.on{background:var(--primary);color:#fff}
.steps .s.done{background:var(--ok-weak);color:var(--ok)}
.banner{padding:12px 15px;border-radius:var(--radius-sm);font-weight:700;font-size:13.5px;margin-bottom:14px}
.banner.ok{background:var(--ok-weak);color:var(--ok)}
.banner.bad{background:var(--danger-weak);color:var(--danger)}
.banner.warn{background:var(--amber-weak);color:var(--amber)}
.kv{display:grid;grid-template-columns:96px 1fr;gap:6px 12px;font-size:13px;margin:10px 0}
.kv b{color:var(--ink-3);font-weight:600}
.otpbox{border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;margin:10px 0;background:var(--surface-2);display:flex;align-items:center;gap:10px;font-size:12.5px;flex-wrap:wrap}
.otpbox .code{color:var(--primary);font-size:22px;font-weight:800;letter-spacing:4px}
.qr{width:124px;height:124px;border:1px solid var(--border);border-radius:8px;flex:none;
  background:repeating-conic-gradient(var(--ink) 0 25%, var(--surface) 0 50%) 0 0/12px 12px}
.demofill{border:1px dashed var(--border-strong);background:var(--surface-2);color:var(--ink-2);border-radius:var(--radius-sm);font:inherit;font-size:12px;font-weight:600;height:28px;padding:0 10px;cursor:pointer}
.demofill:hover{background:var(--surface-3)}

/* ═══ 브레드크럼 ═══ */
.crumb{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--ink-3);margin-left:auto}
.crumb .home::before{content:'⌂ ';}
.crumb .sep{color:var(--border-strong)}
.crumb .cur{color:var(--ink-2);font-weight:600}

/* ═══ 토글 스위치 ═══ */
.switch{position:relative;display:inline-block;width:44px;height:24px;flex:none}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch .track{position:absolute;inset:0;background:var(--border-strong);border-radius:20px;transition:.15s}
.switch .track::before{content:'';position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.switch input:checked+.track{background:var(--primary)}
.switch input:checked+.track::before{transform:translateX(20px)}
.switch input:focus-visible+.track{box-shadow:var(--ring)}

/* ═══ 권한 트리 매트릭스(권한 설정) ═══ */
.permtree-wrap{border:1px solid var(--border);border-radius:var(--radius-sm);overflow:auto;max-height:min(52vh,440px)}
table.permtree{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}
table.permtree thead th{position:sticky;top:0;z-index:5;background:var(--surface-3);color:var(--ink-2);font-size:11.5px;font-weight:700;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;text-align:left}
table.permtree thead th.c{text-align:center}
table.permtree td{padding:6px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
table.permtree td.c{text-align:center}
table.permtree td.pt-dae{background:var(--surface-2);font-weight:700;border-right:1px solid var(--border);white-space:nowrap;border-bottom:0}

<script>
/* ═══ APFS 공통 스크립트 (디자인_작업_가이드 §2~§4) ═══ */
"use strict";
window.APFS=(function(){
  var $=function(s,el){return (el||document).querySelector(s);};
  var $$=function(s,el){return Array.prototype.slice.call((el||document).querySelectorAll(s));};
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

  /* ── 테마 / 내비 토글 ── */
  function initOpts(){
    var seg=$('#nav-seg'); var app=$('.app');
    if(seg&&app){ $$('button',seg).forEach(function(b){ b.addEventListener('click',function(){
      $$('button',seg).forEach(function(x){x.classList.toggle('on',x===b);});
      app.setAttribute('data-nav',b.getAttribute('data-v'));
    });});}
    var th=$('#theme-seg');
    if(th){ $$('button',th).forEach(function(b){ b.addEventListener('click',function(){
      $$('button',th).forEach(function(x){x.classList.toggle('on',x===b);});
      var v=b.getAttribute('data-v');
      if(v==='auto')document.documentElement.removeAttribute('data-theme');
      else document.documentElement.setAttribute('data-theme',v);
      refreshGridThemes();
    });});}
  }

  /* ── 시스템 전환 메뉴 ── */
  function initSysmenu(){
    var mk=$('.sysmark'), menu=$('.sysmenu');
    if(!mk||!menu)return;
    mk.addEventListener('click',function(e){e.stopPropagation();menu.classList.toggle('open');});
    document.addEventListener('click',function(){menu.classList.remove('open');});
    menu.addEventListener('click',function(e){e.stopPropagation();});
  }

  /* ── 토스트 ── */
  var toastT=null;
  function toast(msg){
    var e=$('.toast'); if(e)e.remove(); if(toastT)clearTimeout(toastT);
    var t=document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); t.textContent=msg;
    document.body.appendChild(t); toastT=setTimeout(function(){t.remove();},2400);
  }

  /* ── 모달 (포커스 트랩 · ESC/스크림 닫기 · 스크롤 락 + 패딩 보정) ── */
  var openStack=[];
  function lock(){ if(openStack.length===1){ var sw=window.innerWidth-document.documentElement.clientWidth;
    document.body.style.paddingRight=sw>0?sw+'px':''; document.body.style.overflow='hidden'; } }
  function unlock(){ if(openStack.length===0){ document.body.style.overflow=''; document.body.style.paddingRight=''; } }
  function openModal(id){
    var sc=$('#'+id); if(!sc)return;
    sc.classList.add('open'); openStack.push(id); lock();
    var f=$$('button,input,select,textarea,a[href]',sc).filter(function(el){return !el.disabled&&el.offsetParent!==null;});
    if(f.length)f[0].focus();
    sc.__trap=function(e){
      if(e.key==='Escape'){e.stopPropagation();closeModal(id);}
      if(e.key==='Tab'){
        var fs=$$('button,input,select,textarea,a[href]',sc).filter(function(el){return !el.disabled&&el.offsetParent!==null;});
        if(!fs.length)return;
        var first=fs[0],last=fs[fs.length-1];
        if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
        else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
      }
    };
    sc.addEventListener('keydown',sc.__trap);
  }
  function closeModal(id){
    var sc=$('#'+id); if(!sc)return;
    sc.classList.remove('open');
    var i=openStack.indexOf(id); if(i>=0)openStack.splice(i,1);
    if(sc.__trap){sc.removeEventListener('keydown',sc.__trap);sc.__trap=null;}
    unlock();
  }
  function wireModal(id,onClose){
    var sc=$('#'+id); if(!sc)return;
    sc.addEventListener('mousedown',function(e){ if(e.target===sc){closeModal(id); if(onClose)onClose();} });
    $$('.x,[data-close]',sc).forEach(function(b){ b.addEventListener('click',function(){closeModal(id); if(onClose)onClose();}); });
  }

  /* ── 모달 위 소형 확인 (.addrpick 패턴 — openSubDialog/subConfirm) ── */
  function openSubDialog(html,anchor,onOk){
    var box=$('#addrpick'); if(!box){box=document.createElement('div');box.id='addrpick';box.className='addrpick';document.body.appendChild(box);}
    box.innerHTML=html+'<div style="display:flex;justify-content:flex-end;gap:6px;margin-top:12px">'+
      '<button class="btn-sec btn-sm" data-sub-cancel>취소</button><button class="btn btn-sm" data-sub-ok>확인</button></div>';
    var r=anchor&&anchor.getBoundingClientRect?anchor.getBoundingClientRect():{left:innerWidth/2-180,bottom:innerHeight/2-80};
    box.style.left=Math.max(8,Math.min(innerWidth-370,r.left))+'px';
    box.style.top=Math.min(innerHeight-220,r.bottom+8)+'px';
    box.classList.add('open');
    $('[data-sub-cancel]',box).onclick=function(){box.classList.remove('open');};
    $('[data-sub-ok]',box).onclick=function(){ if(onOk&&onOk(box)===false)return; box.classList.remove('open');};
    var f=$('input,select',box); if(f)f.focus();
  }
  function subConfirm(msg,anchor,onOk){ openSubDialog('<h3>확인</h3><div style="font-size:13px;color:var(--ink-2)">'+esc(msg)+'</div>',anchor,onOk); }
  /* 경고(확인 단일 버튼) — anchor 근처에 표시, 줄바꿈 지원 */
  function subAlert(msg,anchor){
    var box=$('#addrpick'); if(!box){box=document.createElement('div');box.id='addrpick';box.className='addrpick';document.body.appendChild(box);}
    box.innerHTML='<h3 style="color:var(--danger,#d33)">⚠ 삭제 불가</h3><div style="font-size:13px;color:var(--ink-2);line-height:1.5">'+esc(msg).replace(/\n/g,'<br>')+'</div>'+
      '<div style="display:flex;justify-content:flex-end;margin-top:12px"><button class="btn btn-sm" data-sub-ok>확인</button></div>';
    var r=anchor&&anchor.getBoundingClientRect?anchor.getBoundingClientRect():{left:innerWidth/2-180,bottom:innerHeight/2-80};
    box.style.left=Math.max(8,Math.min(innerWidth-370,r.left))+'px';
    box.style.top=Math.min(innerHeight-220,r.bottom+8)+'px';
    box.classList.add('open');
    $('[data-sub-ok]',box).onclick=function(){box.classList.remove('open');};
  }

  /* ── 숫자 자동 콤마 (전역, 예외 .js-rrn-front) ── */
  document.addEventListener('input',function(e){
    var el=e.target;
    if(!(el instanceof HTMLInputElement))return;
    if(el.getAttribute('inputmode')!=='numeric')return;
    if(el.classList.contains('js-rrn-front'))return;
    var raw=el.value.replace(/[^\d]/g,'');
    el.value=raw?Number(raw).toLocaleString('ko-KR'):'';
  });

  /* ── 정렬 가능 그리드 헤더 ── */
  function initSortable(table,getVal,onSorted){
    $$('th.sortable',table).forEach(function(th){
      th.addEventListener('click',function(){
        var cur=th.getAttribute('aria-sort');
        $$('th.sortable',table).forEach(function(x){x.removeAttribute('aria-sort');});
        var dir=cur==='ascending'?'descending':'ascending';
        th.setAttribute('aria-sort',dir);
        onSorted(th.getAttribute('data-key'),dir==='ascending'?1:-1);
      });
    });
  }

  /* ── 행 선택 게이팅 (§4) ── */
  function bindRowSelect(tbody,onSelect){
    tbody.addEventListener('click',function(e){
      var tr=e.target.closest('tr');
      if(!tr||tr.classList.contains('nosel')||tr.classList.contains('empty-row'))return;
      var was=tr.classList.contains('sel');
      $$('tr',tbody).forEach(function(x){x.classList.remove('sel');});
      if(!was)tr.classList.add('sel');
      onSelect(was?null:tr);
    });
  }

  /* ── ⚠ 검토 마커 (추천 vs 데이터) ── */
  function initMarkers(){
    var pop=document.createElement('div'); pop.className='mk-pop'; document.body.appendChild(pop);
    document.addEventListener('click',function(e){
      var mk=e.target.closest('.mk-warn');
      if(!mk){pop.classList.remove('open');return;}
      e.stopPropagation();
      pop.innerHTML='<h4>⚠ 검토 필요 — '+esc(mk.getAttribute('data-title')||'추론값')+'</h4>'+
        '<div class="row"><b>추천</b><span>'+esc(mk.getAttribute('data-rec')||'-')+'</span></div>'+
        '<div class="row"><b>데이터</b><span>'+esc(mk.getAttribute('data-src')||'근거 없음 — 발주처 확정 필요')+'</span></div>';
      var r=mk.getBoundingClientRect();
      pop.style.left=Math.max(8,Math.min(innerWidth-345,r.left))+'px';
      pop.style.top=(r.bottom+7)+'px';
      pop.classList.add('open');
    });
  }

  /* ── TOTP(RFC 6238) 모의 — 배포 시 검증필(KCMVP) 암호모듈로 치환 ── */
  function seedBytes(uid){var s='APFS-'+uid+'-TOTP-SEED-2026',b=[];for(var i=0;i<20;i++)b.push((s.charCodeAt(i%s.length)+i*7)&0xff);return new Uint8Array(b);}
  function b32(bytes){var A='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567',out='',bits=0,val=0;for(var i=0;i<bytes.length;i++){val=(val<<8)|bytes[i];bits+=8;while(bits>=5){out+=A[(val>>>(bits-5))&31];bits-=5;}}if(bits>0)out+=A[(val<<(5-bits))&31];return out;}
  function hotp(key,counter){return crypto.subtle.importKey('raw',key,{name:'HMAC',hash:'SHA-1'},false,['sign']).then(function(k){var buf=new ArrayBuffer(8),dv=new DataView(buf);dv.setUint32(0,Math.floor(counter/4294967296));dv.setUint32(4,counter>>>0);return crypto.subtle.sign('HMAC',k,buf);}).then(function(sig){var s=new Uint8Array(sig),o=s[19]&0xf;var bin=((s[o]&0x7f)<<24)|((s[o+1]&0xff)<<16)|((s[o+2]&0xff)<<8)|(s[o+3]&0xff);return String(bin%1000000).padStart(6,'0');});}
  function cnow(t){return Math.floor((t||Date.now())/1000/30);}
  function totpNow(key){return hotp(key,cnow());}
  function totpVerify(key,code){var c=cnow();return hotp(key,c).then(function(a){if(a===code)return true;return hotp(key,c-1).then(function(b){if(b===code)return true;return hotp(key,c+1).then(function(d){return d===code;});});});}
  /* OTP 라이브 박스 렌더: codeEl에 30초 회전 코드, leftEl에 잔여초 */
  function liveTotp(key,codeEl,leftEl){
    function tick(){ if(leftEl)leftEl.textContent=String(30-(Math.floor(Date.now()/1000)%30));
      totpNow(key).then(function(c){ if(codeEl)codeEl.textContent=c; }); }
    tick(); return setInterval(tick,1000);
  }

  /* ── 비밀번호 정책 ── */
  var PW_POLICY='9자 이상 · 영문·숫자·특수문자 조합 · 최근 비밀번호 재사용 금지 · 90일 주기 변경';
  function pwOK(p){return !!p&&p.length>=9&&/[A-Za-z]/.test(p)&&/\d/.test(p)&&/[^A-Za-z0-9]/.test(p);}

  var kv='<div class="kv"><b>계정명</b><span>'+A.esc(U.name)+' <span class="dbadge amber">온보딩대기</span></span>'+
    '<b>소속/구분</b><span>'+A.esc(A.orgName(U.org))+' ('+A.esc(U.type)+') · 기관소속(개인)</span>'+
    '<b>권한(ROLE)</b><span>'+A.esc(U.roles.join(', '))+'</span><b>이메일</b><span>'+A.esc(U.email)+'</span></div>';
  if(st.step===0){
    h+='<div class="banner ok" style="background:var(--primary-weak);color:var(--primary)">최초 구축 시 정보화팀이 마스터 계정을 설정하고, 이후 관리자가 사용자 계정을 발급합니다. 관리자가 계정을 등록하면 아래 안내 메일이 발송되고, 대상자가 <b>메일의 링크로 접속</b>해 본 화면에서 비밀번호·OTP를 직접 등록합니다(관리자는 비밀번호를 확인하지 않음 · 정보화팀 2026-09-08).</div>'+kv+
      '<div class="note">본 계정은 <b>'+A.esc(A.orgName(U.org))+' 소속 개별 담당자 계정</b>입니다(공유 계정 아님). 담당자 변경 시 이 계정은 비활성되고 새 담당자에게 새 계정이 발급됩니다.<br>링크 유효기간: 발송 후 72시간(만료 시 재발송 요청)</div>'+
      '<button class="btn" id="go" style="width:100%;height:42px;margin-top:6px">✉ 메일의 [계정 활성화] 링크 접속 →</button>';
  } else if(st.step===1){
    h+=kv+
      '<div class="frow"><label class="req">① 비밀번호 설정</label><input id="f-p1" type="password" placeholder="9자 이상 · 영문·숫자·특수문자"></div>'+
      '<div class="frow"><label class="req">비밀번호 확인</label><input id="f-p2" type="password"></div>'+
      '<div class="hint" style="margin:2px 0 10px">② <b>OTP 등록</b> — 인증앱(Google/MS Authenticator)으로 QR을 <b>1회</b> 스캔한 뒤 6자리를 입력합니다. 등록 순간 서버가 시드를 생성해 DB에 암호화 저장하며, 이후 로그인은 QR 없이 6자리만 입력합니다.</div>'+
      '<div style="display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap">'+
        '<div style="text-align:center"><div class="qr"></div><div class="hint">QR 스캔(최초 1회)</div></div>'+
        '<div style="flex:1;min-width:230px">'+
          '<div class="hint">수동 입력용 시드(Base32): <code id="seed">…</code></div>'+
          '<div class="otpbox"><span>📱 폰 앱(모의)</span><span class="code" id="live">------</span><span>(<b id="left">--</b>s)</span><button class="demofill" id="fill" type="button">데모: 코드 자동입력</button></div>'+
          '<div class="frow" style="grid-template-columns:1fr"><input id="f-otp" maxlength="6" inputmode="numeric" class="js-rrn-front" placeholder="앱에 표시된 6자리로 등록 확인"></div>'+
        '</div></div>'+
      '<div id="msg"></div>'+
      '<button class="btn" id="go" style="width:100%;height:42px;margin-top:4px">등록 확인 → 계정 활성</button>'+
      '<div class="note">QR·비밀번호는 이메일이 아니라 <b>본 화면에서만</b> 표시됩니다(중간 탈취 방지).</div>';
  } else {
    h+='<div class="banner ok">✔ 온보딩 완료 — <b>'+A.esc(U.name)+'</b> ('+A.esc(A.orgName(U.org))+') 계정이 <b>활성</b>되었습니다.</div>'+
      '<div class="note">다음부터의 로그인 = 아이디 + 비밀번호 + <b>앱의 6자리</b> (QR 재스캔 없음)</div>'+
      '<a class="btn" href="S0_001_로그인.html" style="width:100%;height:42px;text-decoration:none">로그인 화면으로 이동</a>'+
      '<button class="btn-sec" id="again" style="width:100%;height:38px;margin-top:8px">처음부터 다시 보기</button>';
  }
  $('#body').innerHTML=h; wire();
}
function wire(){
  var go=$('#go');
  if(st.step===0&&go)go.addEventListener('click',function(){st.step=1;render();});
  if(st.step===1){
    var key=A.seedBytes(U.id);
    $('#seed').textContent=A.b32(key);
    st.timer=A.liveTotp(key,$('#live'),$('#left'));
    $('#fill').addEventListener('click',function(){A.totpNow(key).then(function(c){$('#f-otp').value=c;});});
    go.addEventListener('click',function(){
      /* 검증: 화면 필드 순서(위→아래) — ① 비밀번호 → 확인 → ② OTP */
      if(!A.pwOK($('#f-p1').value)){$('#msg').innerHTML='<div class="banner bad">비밀번호가 정책을 충족하지 않습니다 (9자 이상 · 영문·숫자·특수문자).</div>';$('#f-p1').focus();return;}
      if($('#f-p1').value!==$('#f-p2').value){$('#msg').innerHTML='<div class="banner bad">비밀번호 확인이 일치하지 않습니다.</div>';$('#f-p2').focus();return;}
      var code=($('#f-otp').value||'').trim();
      if(!code){$('#msg').innerHTML='<div class="banner bad">앱에 표시된 6자리 코드를 입력해 주세요.</div>';$('#f-otp').focus();return;}
      A.totpVerify(A.seedBytes(U.id),code).then(function(ok){
        if(!ok){$('#msg').innerHTML='<div class="banner bad">코드가 일치하지 않거나 만료되었습니다 — 현재 코드로 다시 시도해 주세요.</div>';return;}
        st.step=2;render();A.toast('계정이 활성되었습니다.');
      });
    });
  }
  if($('#again'))$('#again').addEventListener('click',function(){st.step=0;render();});
}
document.addEventListener('DOMContentLoaded',render);
})();
</script>
</body>
</html>
