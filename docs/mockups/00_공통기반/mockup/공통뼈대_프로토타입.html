<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공통 뼈대 프로토타입 — 인증·계정·권한(ROLE)·데이터스코프</title>
<style>
  :root{--bg:#F3F5F8;--surface:#fff;--surface2:#F7F9FC;--border:#DCE0E6;--ink:#1A1D21;--ink2:#48505A;--ink3:#6B7480;
    --primary:#256EF4;--primary-weak:#EAF1FE;--ok:#0E7C86;--ok-weak:#E2F3F4;--amber:#B45309;--amber-weak:#FBF0E1;
    --danger:#E5484D;--danger-weak:#FDECEC;--grey-weak:#EEF2F7;--radius:10px;--shadow:0 1px 3px rgba(16,24,40,.08)}
  @media (prefers-color-scheme:dark){:root{--bg:#0F141B;--surface:#171E27;--surface2:#1C242F;--border:#2C3846;--ink:#EAEEF3;--ink2:#AEB8C4;--ink3:#7E8996;--primary:#5B94FF;--primary-weak:#16233B;--ok:#3FB8C2;--ok-weak:#123033;--amber:#E7A24A;--amber-weak:#2A2113;--danger:#F26D6D;--danger-weak:#2A1616;--grey-weak:#232C38}}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Pretendard','Malgun Gothic',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
  .app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}
  .side{background:var(--surface);border-right:1px solid var(--border);padding:18px 14px;position:sticky;top:0;height:100vh;overflow-y:auto}
  .brand{font-weight:800;font-size:15px;margin:0 6px 4px}
  .brand small{display:block;font-weight:500;color:var(--ink3);font-size:11.5px;margin-top:2px}
  .navsec{font-size:11px;color:var(--ink3);font-weight:700;margin:16px 8px 6px;text-transform:uppercase;letter-spacing:.04em}
  .nav a{display:flex;gap:8px;align-items:center;padding:9px 10px;border-radius:8px;color:var(--ink2);text-decoration:none;cursor:pointer;font-weight:600;font-size:13px}
  .nav a:hover{background:var(--surface2)}
  .nav a.on{background:var(--primary-weak);color:var(--primary)}
  .nav a .num{width:20px;height:20px;border-radius:6px;background:var(--grey-weak);color:var(--ink3);display:grid;place-items:center;font-size:11px;font-weight:800;flex:none}
  .nav a.on .num{background:var(--primary);color:#fff}
  .nav .navgrp{margin:12px 4px 4px;font-size:10.5px;font-weight:800;letter-spacing:.4px;color:var(--ink3);text-transform:none}
  .nav .navgrp:first-child{margin-top:2px}
  .main{padding:26px 30px;min-width:0}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:var(--ink3);margin:0 0 18px;font-size:13px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
  .card h3{margin:0 0 12px;font-size:14px}
  .grid2{display:grid;grid-template-columns:320px 1fr;gap:16px;align-items:start}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  label.f{display:block;font-size:12px;color:var(--ink3);font-weight:600;margin-bottom:5px}
  input,select{height:38px;padding:0 11px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;min-width:0}
  input:focus,select:focus{outline:2px solid var(--primary);outline-offset:-1px}
  .field{margin-bottom:12px}
  .btn{height:38px;padding:0 15px;border:1px solid var(--primary);background:var(--primary);color:#fff;border-radius:8px;font:inherit;font-weight:700;cursor:pointer}
  .btn:hover{filter:brightness(1.05)}
  .btn.sec{background:var(--surface);color:var(--ink);border-color:var(--border)}
  .btn.danger{background:var(--danger);border-color:var(--danger)}
  .btn.sm{height:32px;padding:0 11px;font-size:12.5px}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--border);vertical-align:middle}
  th{background:var(--surface2);color:var(--ink2);font-weight:700;font-size:12px}
  td.c,th.c{text-align:center}
  .tag{display:inline-block;padding:1px 8px;border-radius:5px;font-size:11.5px;font-weight:700;margin:1px}
  .tag.g{background:var(--ok-weak);color:var(--ok)} .tag.n{background:var(--grey-weak);color:var(--ink3)}
  .tag.b{background:var(--primary-weak);color:var(--primary)} .tag.a{background:var(--amber-weak);color:var(--amber)}
  .tag.r{background:var(--danger-weak);color:var(--danger)}
  .pill{display:inline-flex;gap:6px;align-items:center;padding:4px 10px;border-radius:20px;background:var(--surface2);border:1px solid var(--border);font-size:12px;font-weight:600}
  .note{font-size:12.5px;color:var(--ink3);background:var(--surface2);border:1px dashed var(--border);border-radius:8px;padding:10px 12px;margin-top:10px}
  .ok{color:var(--ok);font-weight:700}.bad{color:var(--danger);font-weight:700}
  .steps{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
  .steps .s{padding:4px 10px;border-radius:20px;background:var(--grey-weak);color:var(--ink3);font-size:12px;font-weight:700}
  .steps .s.on{background:var(--primary);color:#fff}.steps .s.done{background:var(--ok-weak);color:var(--ok)}
  .kv{display:grid;grid-template-columns:130px 1fr;gap:6px 10px;font-size:13px;margin:8px 0}
  .kv b{color:var(--ink3);font-weight:600}
  .banner{padding:12px 16px;border-radius:8px;font-weight:700;margin-bottom:14px}
  .banner.ok{background:var(--ok-weak);color:var(--ok)}.banner.bad{background:var(--danger-weak);color:var(--danger)}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:8px;font-weight:600;z-index:99;box-shadow:0 8px 30px rgba(0,0,0,.3)}
  .who{margin:0 6px 10px;padding:10px;border-radius:8px;background:var(--surface2);border:1px solid var(--border);font-size:12px}
  .who b{color:var(--ink)}
  code{background:var(--grey-weak);padding:1px 5px;border-radius:4px;font-size:12px}
  .rolelist{border:1px solid var(--border);border-radius:8px;overflow:hidden}
  .rolelist .ri{display:flex;justify-content:space-between;align-items:center;padding:9px 11px;border-bottom:1px solid var(--border);cursor:pointer;font-size:13px}
  .rolelist .ri:last-child{border-bottom:0}
  .rolelist .ri.on{background:var(--primary-weak)}
  .rolelist .ri b{font-weight:700}
  .chk{display:inline-flex;gap:6px;align-items:center;padding:6px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;margin:3px}
  .chk input{height:15px}
  .chk.on{background:var(--primary-weak);border-color:var(--primary);color:var(--primary)}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <p class="brand">농금원 통합포털 <small>공통 뼈대 프로토타입 v0.2</small></p>
    <div class="who" id="who"></div>
    <div class="navsec">시나리오</div>
    <nav class="nav" id="nav"></nav>
    <div class="navsec">검증</div>
    <nav class="nav">
      <a id="run-all"><span class="num">▶</span> 전체 시나리오 자동실행(자체테스트)</a>
      <a id="reset"><span class="num">↺</span> 상태 초기화</a>
    </nav>
  </aside>
  <main class="main" id="main"></main>
</div>
<script>
"use strict";
(function(){
  /* ============ 메뉴 & Role 정의 ============ */
  var BASE_MENUS=[
    {k:'fund',n:'자펀드관리'},{k:'risk',n:'조기경보'},{k:'report',n:'자펀드보고'},
    {k:'trust',n:'수탁보고'},{k:'brief',n:'부처보고'},{k:'acct',n:'회계(기간계)'},
    {k:'user',n:'사용자관리'},{k:'role',n:'권한관리'},{k:'audit',n:'감사로그'}
  ];
  var MENUS=BASE_MENUS.slice(); // 작업용(seed마다 초기화)
  function blank(){var o={};MENUS.forEach(function(m){o[m.k]={v:false,d:false,c:false,a:false};});return o;}
  function setP(o,keys,perm){keys.forEach(function(k){perm.split('').forEach(function(p){o[k][p]=true;});});return o;}
  var ROLES={}; // { roleName: matrix }
  function defRoles(){
    ROLES={};
    ROLES['투자팀']=setP(blank(),['fund','risk','report','trust','brief','audit'],'v');
    ROLES['투자팀'].fund={v:true,d:true,c:true,a:false};
    ROLES['투자팀'].report={v:true,d:true,c:false,a:false};
    ROLES['전산(관리자)']=(function(){var o=blank();MENUS.forEach(function(m){o[m.k]={v:true,d:true,c:true,a:true};});return o;})();
    ROLES['운용사']=setP(setP(blank(),['fund'],'v'),['report'],'vdc');
    ROLES['수탁']=setP(setP(blank(),['fund'],'v'),['trust'],'vdc');
    ROLES['부처']=setP(blank(),['brief'],'vd');
  }
  /* ============ 상태 ============ */
  var S={};
  function seed(){
    MENUS.length=0; BASE_MENUS.forEach(function(m){MENUS.push({k:m.k,n:m.n});});
    defRoles();
    S.orgs=[
      {id:'KB',type:'GP',name:'KB증권'},{id:'IMM',type:'GP',name:'IMM인베스트먼트'},
      {id:'HTP',type:'GP',name:'한국투자파트너스'},{id:'YT',type:'GP',name:'유안타인베스트먼트'},
      {id:'NH',type:'수탁',name:'농협은행'},{id:'IBK',type:'수탁',name:'IBK기업은행'},{id:'KDB',type:'수탁',name:'KDB산업은행'}
    ];
    S.funds=[
      {id:'F1',name:'현대동양농식품사모투자',year:'2010',gp:[{org:'KB',role:'대표'}],trustee:'NH',account:'농식품',mgr:'김담당',stage:'결성'},
      {id:'F2',name:'IMM 농식품 스마트투자조합',year:'2018',gp:[{org:'IMM',role:'대표'}],trustee:'IBK',account:'농식품',mgr:'이담당',stage:'결성'},
      {id:'F3',name:'한투 청년농식품투자조합',year:'2022',gp:[{org:'HTP',role:'대표'}],trustee:'NH',account:'수산',mgr:'김담당',stage:'선정'},
      {id:'F4',name:'공동운용 상생농식품조합',year:'2024',gp:[{org:'IMM',role:'대표'},{org:'YT',role:'공동'}],trustee:'IBK',account:'농식품',mgr:'이담당',stage:'결성'}
    ];
    S.personnel=[
      {org:'IMM',name:'정운용',email:'jung@imm.co.kr',active:true},{org:'IMM',name:'박심사',email:'park@imm.co.kr',active:true},
      {org:'HTP',name:'최투자',email:'choi@htp.co.kr',active:true},{org:'YT',name:'한공동',email:'han@yt.co.kr',active:true}
    ];
    S.users=[
      {id:'U1',loginId:'nh.invest',name:'김담당',type:'농금원',dept:'투자팀',email:'kim@apfs.go.kr',roles:['투자팀'],status:'활성',otpEnrolled:true,pwSet:true},
      {id:'U2',loginId:'nh.admin',name:'전산관리(시드)',type:'농금원',dept:'전산',email:'sys@apfs.go.kr',roles:['전산(관리자)'],status:'온보딩대기',seed:true,pwSet:true,pwExpired:true},
      {id:'U3',loginId:'imm.rep',name:'이대표',type:'운용사',org:'IMM',email:'lee@imm.co.kr',roles:['운용사'],status:'활성',pwExpired:true,otpEnrolled:true,pwSet:true},
      {id:'U4',loginId:'nh.trust',name:'김수탁',type:'수탁',org:'NH',email:'trust@nonghyup.com',roles:['수탁'],status:'활성',otpEnrolled:true,pwSet:true},
      {id:'U5',loginId:'mafra',name:'박농식',type:'부처',account:'농식품',email:'mafra@korea.kr',roles:['부처'],status:'활성',otpEnrolled:true,pwSet:true}
    ];
    S.invites=[]; S.logs=[]; S.currentUser=null; S.viewRole='U1';
    log('시스템','시드 초기화','-','정상');
  }
  var _t=0; function tick(){_t++; return '2026-08-25 09:'+String(10+Math.floor(_t/60)).slice(-2)+':'+String(_t%60).padStart(2,'0');}
  function log(actor,action,target,result){ S.logs.unshift({ts:tick(),actor:actor,action:action,target:target,ip:'10.0.'+(1+S.logs.length%5)+'.'+(20+S.logs.length%80),result:result||'정상'}); }

  /* ============ 권한 계산 ============ */
  function orgName(id){var o=S.orgs.filter(function(x){return x.id===id;})[0];return o?o.name:id;}
  function userById(id){return S.users.filter(function(u){return u.id===id;})[0];}
  function roleCount(rn){return S.users.filter(function(u){return (u.roles||[]).indexOf(rn)>=0;}).length;}
  function effPerm(u){ // Role 합집합
    var o=blank();
    (u&&u.roles||[]).forEach(function(rn){var r=ROLES[rn]; if(!r)return;
      MENUS.forEach(function(m){['v','d','c','a'].forEach(function(p){ if(r[m.k]&&r[m.k][p]) o[m.k][p]=true; });});});
    return o;
  }
  function hasMenu(u,k){return !!effPerm(u)[k] && effPerm(u)[k].v;}
  function hasPerm(u,k,p){var e=effPerm(u)[k];return !!(e&&e[p]);}
  function isAdmin(u){return (u&&u.roles||[]).indexOf('전산(관리자)')>=0 || hasPerm(u,'user','a');}
  function rolesLabel(u){return (u&&u.roles||[]).join(' · ')||'-';}
  function acctType(u){return (u&&(u.type==='수탁'||u.type==='부처'))?'기관':'개인';}  // '기관'=기관소속 개별계정(공유 아님)
  function belongLabel(u){return (u&&u.type==='농금원')?'내부(개인)':'기관소속(개인)';}  // 모든 계정=개별(개인). 소속만 구분
  /* 비밀번호 정책: 9자↑ + 영문·숫자·특수 3종 조합 */
  var PW_POLICY='9자 이상 · 영문·숫자·특수문자 조합 · 최근 비밀번호 재사용 금지 · 90일 주기 변경';
  function pwOK(p){return !!p&&p.length>=9&&/[A-Za-z]/.test(p)&&/\d/.test(p)&&/[^A-Za-z0-9]/.test(p);}
  var LOCK_LIMIT=5; // 로그인 실패 5회 → 잠금

  function scopeFunds(u){
    if(!u) return {list:[],soft:null,label:'-'};
    if(u.type==='농금원'){
      if(isAdmin(u)) return {list:S.funds,soft:null,label:'전체(관리자)'};
      return {list:S.funds,soft:S.funds.filter(function(f){return f.mgr===u.name;}),label:'전체(기본:내 담당)'};
    }
    if(u.type==='운용사') return {list:S.funds.filter(function(f){return f.gp.some(function(g){return g.org===u.org;});}),soft:null,label:'소속 운용사('+orgName(u.org)+')'};
    if(u.type==='수탁') return {list:S.funds.filter(function(f){return f.trustee===u.org;}),soft:null,label:'주수탁('+orgName(u.org)+')'};
    if(u.type==='부처') return {list:S.funds.filter(function(f){return f.account===u.account;}),soft:null,label:'계정구분('+u.account+')'};
    return {list:[],soft:null,label:'-'};
  }
  function canReport(u,f){
    if(!u||!f) return false;
    if(u.type==='농금원') return isAdmin(u)||hasPerm(u,'report','c')||hasPerm(u,'fund','c');
    if(u.type==='운용사') return f.gp.some(function(g){return g.org===u.org&&g.role==='대표';});
    if(u.type==='수탁') return f.trustee===u.org;
    return false;
  }
  function canSeeFund(u,f){return scopeFunds(u).list.some(function(x){return x.id===f.id;});}

  /* ============ 렌더 프레임 ============ */
  var $=function(id){return document.getElementById(id);};
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function toast(m){var e=document.querySelector('.toast');if(e)e.remove();var t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove();},2200);}
  var SCN=[
    /* ① 설치 직후 — 콜드스타트 */
    {k:'s12',n:'최초 관리자 셋팅(부트스트랩)',g:'① 설치·초기화'},
    /* ② 관리자가 권한 체계·계정을 준비 (운용사는 우선순위 최하위 → 뒤) */
    {k:'s4',n:'권한관리(ROLE 등록·복사)',g:'② 관리자 준비'},
    {k:'s9',n:'사용자관리 등록·ROLE·상태(농금원·수탁·부처)',g:'② 관리자 준비'},
    {k:'s3',n:'사용자 초대(운용사)',g:'② 관리자 준비'},
    /* ③ 대상자가 온보딩(비번·OTP 등록) (운용사는 뒤) */
    {k:'s13',n:'발급 온보딩(농금원·수탁·부처·링크접속)',g:'③ 사용자 온보딩'},
    {k:'s2',n:'초대 온보딩(운용사·간편인증·실명매칭)',g:'③ 사용자 온보딩'},
    /* ④ 일상 운영 — 로그인 후 권한·스코프 효과 */
    {k:'s1',n:'로그인 + 2차 인증',g:'④ 운영·접근'},
    {k:'s5',n:'데이터 스코프 시연',g:'④ 운영·접근'},
    {k:'s6',n:'접근제어 위반 차단',g:'④ 운영·접근'},
    /* ⑤ 계정 라이프사이클·보안 */
    {k:'s10',n:'비밀번호·계정 보안',g:'⑤ 라이프사이클·보안'},
    {k:'s7',n:'퇴사 → 계정 자동 비활성',g:'⑤ 라이프사이클·보안'},
    /* ⑥ 참조·감사 */
    {k:'s11',n:'DB 저장 샘플(비번·OTP시드)',g:'⑥ 참조·감사'},
    {k:'s8',n:'감사로그 조회',g:'⑥ 참조·감사'}
  ];
  var cur='s12';
  function renderNav(){
    var lastG=null;
    $('nav').innerHTML=SCN.map(function(s,i){
      var hdr=(s.g&&s.g!==lastG)?'<div class="navgrp">'+esc(s.g)+'</div>':'';
      lastG=s.g||lastG;
      return hdr+'<a data-k="'+s.k+'" class="'+(s.k===cur?'on':'')+'"><span class="num">'+(i+1)+'</span>'+esc(s.n)+'</a>';
    }).join('');
    Array.prototype.forEach.call($('nav').querySelectorAll('a'),function(a){a.addEventListener('click',function(){go(a.getAttribute('data-k'));});});
    var u=S.currentUser;
    $('who').innerHTML=u?('로그인: <b>'+esc(u.name)+'</b><br><span class="tag b">'+esc(rolesLabel(u))+'</span><br><span style="color:var(--ink3)">'+esc(u.type)+(u.org?' · '+esc(orgName(u.org)):'')+(u.account?' · '+esc(u.account):'')+'</span>'):'<span style="color:var(--ink3)">미로그인 — 「로그인 + 2차 인증」</span>';
  }
  function go(k){cur=k;renderNav();render();window.scrollTo(0,0);}
  function render(){

  var JAVA_SAMPLE =
  "// ── 계정 최초 OTP 등록 시 ────────────────────────────\n"+
  "// 1) 시드(secret) 생성 : 암호학적 난수 160bit(RFC 6238)\n"+
  "byte[] seed = new byte[20];\n"+
  "new SecureRandom().nextBytes(seed);\n"+
  "String base32 = Base32.encode(seed);   // QR/수동입력용\n"+
  "// otpauth://totp/APFS:{loginId}?secret={base32}&issuer=APFS&period=30\n"+
  "\n"+
  "// 2) 시드 양방향 암호화 후 DB 저장  (배포:검증필 모듈로 치환)\n"+
  "byte[] iv = new byte[12]; new SecureRandom().nextBytes(iv);\n"+
  "Cipher cipher = Cipher.getInstance(\"AES/GCM/NoPadding\");\n"+
  "cipher.init(Cipher.ENCRYPT_MODE, kek, new GCMParameterSpec(128, iv));\n"+
  "byte[] ct = cipher.doFinal(seed);\n"+
  "String otpSeedEnc = Base64.getEncoder()\n"+
  "        .encodeToString(concat(iv, ct));   // → OTP_SEED_ENC 컬럼\n"+
  "\n"+
  "// ── 로그인 2차: TOTP 검증 (RFC 6238) ─────────────────\n"+
  "byte[] key = decryptSeed(otpSeedEnc, kek);         // DB→복호\n"+
  "boolean ok = verify(key, inputCode, System.currentTimeMillis());\n"+

  "String totp(byte[] key, long ms) throws Exception {\n"+
  "    long counter = ms / 1000L / 30L;               // 30초 스텝\n"+
  "    byte[] m = ByteBuffer.allocate(8).putLong(counter).array();\n"+
  "    Mac mac = Mac.getInstance(\"HmacSHA1\");          // 검증필 모듈로\n"+
  "    mac.init(new SecretKeySpec(key, \"HmacSHA1\"));\n"+
  "    byte[] h = mac.doFinal(m);\n"+
  "    int o = h[h.length-1] & 0x0F;                   // dynamic truncation\n"+
  "    int bin = ((h[o]&0x7f)<<24)|((h[o+1]&0xff)<<16)\n"+
  "            |((h[o+2]&0xff)<<8)|(h[o+3]&0xff);\n"+
  "    return String.format(\"%06d\", bin % 1000000);    // 6자리\n"+
  "}\n"+
  "boolean verify(byte[] key, String in, long now) throws Exception {\n"+
  "    for (int w=-1; w<=1; w++)                        // 허용창 ±1(시계오차)\n"+
  "        if (totp(key, now + w*30000L).equals(in)) return true;\n"+
  "    return false;\n"+
  "}\n"+

      S.invites.push({token:'t1',targetName:'정운용',email:'jung@imm.co.kr',org:'IMM',role:'운용사',status:'발송'});
      log('관리자','사용자 초대 발송','정운용','정상');
      var uc=S.users.length; var inv=pickInvite(); inv.status='수락';
      S.users.push({id:'UX',loginId:'imm.new',name:'정운용',type:'운용사',org:'IMM',roles:['운용사'],status:'활성'});
      log('가입:정운용','계정 활성','초대수락','정상');
      ok(S.users.length===uc+1,'초대 수락→계정 생성');
      // 데이터 스코프
      ok(scopeFunds(userById('U3')).list.length===2,'IMM 스코프=2건');
      var yt={type:'운용사',org:'YT',roles:['운용사']};
      ok(scopeFunds(yt).list.length===1,'유안타 공동 열람=1건');
      ok(!canReport(yt,S.funds[3]),'유안타 F4 보고 불가(공동)');
      ok(canReport(userById('U3'),S.funds[3]),'IMM F4 보고 가능(대표)');
      // 접근제어
      ok(!hasMenu(userById('U3'),'acct'),'IMM 회계 메뉴 없음');
      ok(!canSeeFund(userById('U3'),S.funds[0]),'IMM F1 조회 불가');
      log('imm.rep','비정상 접근(메뉴)','회계','차단');log('imm.rep','비정상 접근(데이터)','F1','차단');
      // ROLE 복수 지정 → 합집합
      var multi={roles:['부처','수탁']};
      ok(hasMenu(multi,'brief')&&hasMenu(multi,'trust'),'복수 ROLE 합집합(부처+수탁)');
      // ROLE 복사
      var before=Object.keys(ROLES).length;
      var src=ROLES['운용사'],cp=blank();MENUS.forEach(function(m){cp[m.k]={v:src[m.k].v,d:src[m.k].d,c:src[m.k].c,a:src[m.k].a};});ROLES['운용사 (복사)']=cp;
      ok(Object.keys(ROLES).length===before+1&&hasMenu({roles:['운용사 (복사)']},'report'),'ROLE 복사=권한 세트 복제');
      // 신규 메뉴 → ROLE 반영 시 전 사용자 적용
      var mlen=MENUS.length; MENUS.push({k:'newx',n:'신규메뉴X'}); Object.keys(ROLES).forEach(function(rn){ROLES[rn]['newx']={v:false,d:false,c:false,a:false};});
      ROLES['운용사'].newx.v=true;
      ok(MENUS.length===mlen+1&&hasMenu(userById('U3'),'newx'),'신규 메뉴 ROLE 반영→해당 ROLE 사용자 자동 적용');
      // 사용자관리 다중 ROLE 저장
      S.users.push({id:'UY',loginId:'multi',name:'겸직자',type:'농금원',dept:'투자팀',roles:['투자팀','전산(관리자)'],status:'활성'});
      ok(isAdmin(userById('UY')),'겸직(투자팀+전산)→관리자 권한 포함');
      // 수탁/부처 = 담당자별 개별 계정(공유 ID 폐지)
      var trust=userById('U4');
      ok(acctType(trust)==='기관'&&!trust.curHandler,'수탁=기관소속 개별 계정(공유 담당자 개념 없음)');
      // 담당자 교체 = 구계정 비활성 + 신계정 발급
      trust.status='비활성'; var beforeN=S.users.length;
      S.users.push({id:'UR',loginId:'nh.r',name:'이수탁',type:'수탁',org:'NH',roles:['수탁'],status:'온보딩대기'});
      log('관리자','담당자 교체(구계정 비활성+신계정 발급)','김수탁 → 이수탁','정상');
      ok(trust.status==='비활성'&&S.users.length===beforeN+1,'담당자 교체=구계정 비활성+신계정 발급(같은 ID 안 물려줌)');
      // 부트스트랩(최초 관리자 셋팅): 시드 계정→비번변경+OTP등록→활성
      var boot=bootAdmin();
      ok(boot.seed===true&&boot.status==='온보딩대기'&&!boot.otpEnrolled&&boot.pwExpired===true,'부트스트랩 시드 관리자=온보딩대기·임시비번·OTP미등록');
      boot.pwExpired=false; boot.pwSet=true; boot.otpEnrolled=true; boot.status='활성';
      log('nh.admin','부트스트랩 최초셋팅(비번변경+OTP등록)','시드→활성','정상');
      ok(boot.status==='활성'&&boot.otpEnrolled&&!boot.pwExpired,'부트스트랩 완료→관리자 활성(이후 사용자 등록·초대 가능)');
      // 관리자 발급 온보딩(농금원·수탁·부처): 등록→메일→링크 접속→비번설정+OTP등록→활성
      var onb=s13target();
      ok(onb.status==='온보딩대기'&&onb.type!=='운용사'&&!onb.otpEnrolled,'발급 온보딩 대상=온보딩대기·비운용사·OTP미등록');
      onb.status='활성'; onb.otpEnrolled=true; onb.pwSet=true;
      log(onb.loginId||onb.name,'온보딩 접속·비번설정+OTP등록·활성','메일 링크 접속','정상');
      ok(onb.status==='활성'&&onb.otpEnrolled&&onb.pwSet,'발급 온보딩 완료→활성(비번+OTP 등록)');
      // 비밀번호 정책·잠금·만료
      ok(pwOK('Apfs2026!@')&&!pwOK('abc12')&&!pwOK('abcdefghi'),'비밀번호 정책(9자+영문·숫자·특수)');
      var lk=userById('U1'); lk.failCount=LOCK_LIMIT; lk.status='잠금'; log('시스템','계정 잠금('+LOCK_LIMIT+'회)',lk.name,'차단');
      ok(lk.status==='잠금','로그인 '+LOCK_LIMIT+'회 실패→잠금');
      lk.status='활성'; lk.failCount=0; log('관리자','계정 잠금 해제',lk.name,'정상');
      ok(lk.status==='활성'&&lk.failCount===0,'관리자 잠금 해제');
      ok(userById('U3').pwExpired===true,'비밀번호 만료 플래그(로그인 시 강제변경)');
      // 퇴사 자동 비활성
      var na=userById('UX'); na.status='비활성'; log('시스템','계정 자동 비활성','정운용','정상');
      ok(na.status==='비활성','퇴사→자동 비활성');
      // 감사로그
      ok(S.logs.length>=6,'감사로그 누적 '+S.logs.length);
      ok(S.logs.filter(function(l){return l.result==='차단';}).length>=2,'차단 로그 2건+');
    }catch(e){fails.push('예외:'+e.message);console.error('[SELFTEST] EXCEPTION',e);}
    var pass=fails.length===0;
    console.log('[SELFTEST] '+(pass?'PASS':'FAIL')+' ('+fails.length+' 실패)');
    renderNav();
    $('main').innerHTML=head('자체 테스트 결과','전체 프로세스를 코드로 끝까지 구동 → 단언 검증.')+
      '<div class="card"><div class="banner '+(pass?'ok':'bad')+'">'+(pass?'✔ PASS':'✖ FAIL')+' — 자동실행 완료, '+(pass?'모든 단계 통과':(fails.length+'건 실패'))+'</div>'+
      (pass?'':'<ul>'+fails.map(function(f){return '<li class="bad">'+esc(f)+'</li>';}).join('')+'</ul>')+
      '<div class="note">로그인→초대→수락→스코프(하드/공동)→접근차단→<b>복수ROLE 합집합</b>→<b>ROLE 복사</b>→<b>신규메뉴 자동적용</b>→겸직 관리자→퇴사 비활성→감사로그. 콘솔 <code>[SELFTEST]</code> 참조.</div>'+
      '<div class="row"><button class="btn" id="t-audit">감사로그</button><button class="btn sec" id="t-reset">상태 초기화</button></div></div>';
    $('t-audit').addEventListener('click',function(){go('s8');});
    $('t-reset').addEventListener('click',function(){resetAll();});
    return pass;
  }
  function resetAll(){clearS1Timer();clearS2Timer();clearS9Timer();clearS12Timer();clearS13Timer();seed();s1state={step:0,uid:null};s12s=0;s13s=0;s13uid=null;s2state=null;s3msg='';s5soft=true;s7msg='';s9msg='';s9mail='';s10mail='';s4sel=null;s9edit=null;s9form=null;go('s12');}

  function boot(){seed();renderNav();go('s12');$('run-all').addEventListener('click',function(){runAll();});$('reset').addEventListener('click',function(){resetAll();toast('초기화');});}
  document.addEventListener('DOMContentLoaded',boot);
  window.__runAll=runAll;
})();
</script>
